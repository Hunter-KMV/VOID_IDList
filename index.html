<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID ID-лист</title>
<!-- Просмотр пакета VOID_IDList: данные из idlist.json рядом (GitHub Pages) или вшитые программой при предпросмотре. -->
<style>
:root{
  --bg0:#04050A; --bg1:#070912; --bg2:#0A0D1A;
  --panel:rgba(14,18,34,.72); --panel-2:rgba(22,28,52,.78);
  --line:rgba(170,190,240,.12); --line-2:rgba(170,190,240,.22);
  --text:#E8EFFC; --muted:#8E9AB8; --dim:#5F6A88;
  --accent:#C9D8FF; --accent-2:#FFF3DE; --glow:rgba(200,215,255,.35);
  --ok:#8FE3B5; --warn:#FFC98A;
  --radius:14px;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg0);color:var(--text);font:14px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
/* космический фон как во втором логотипе */
.sky{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 70% 55% at 50% 18%,rgba(42,58,107,.34) 0%,rgba(22,32,63,.16) 50%,rgba(0,0,0,0) 100%),
    radial-gradient(ellipse 50% 40% at 85% 80%,rgba(60,40,110,.12) 0%,rgba(0,0,0,0) 70%),
    linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg0) 100%);}
.vig{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,2,6,.75) 100%);}
#stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}

.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 56px}
header{text-align:center;padding:18px 0 8px}
.logo{width:min(560px,88vw);height:auto;display:block;margin:0 auto;
  filter:drop-shadow(0 0 10px rgba(220,232,255,.28)) drop-shadow(0 0 28px rgba(160,185,255,.18))}
.kicker{margin:14px 0 0;line-height:1.7;color:var(--muted);font-size:12px;letter-spacing:.32em;text-transform:uppercase}
h1{margin:6px 0 0;font-weight:300;font-size:clamp(24px,3.4vw,34px);letter-spacing:.04em}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 0}
.stat{border:1px solid var(--line);background:rgba(10,13,26,.55);border-radius:999px;padding:5px 12px;color:var(--muted);font-size:12.5px}
.stat b{color:var(--text);font-weight:600}

/* панель управления */
.bar{position:sticky;top:0;z-index:20;margin:26px 0 12px;padding:12px;border:1px solid var(--line);
  border-radius:var(--radius);background:rgba(8,11,22,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.02);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(201,216,255,.18),rgba(201,216,255,.08));color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2),0 0 18px rgba(160,185,255,.12)}
.seg .n{margin-left:7px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"] .n{color:var(--accent)}
.seg button:focus-visible,.sw:focus-visible,.btn:focus-visible,.fbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sw{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;color:var(--muted);user-select:none;padding:4px 2px}
.sw .lbl{transition:color .15s}
.sw .track{width:44px;height:24px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line-2);position:relative;transition:background .2s}
.sw .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#DDE6FA;box-shadow:0 0 10px var(--glow);transition:transform .2s}
.sw[aria-checked="true"] .track{background:rgba(201,216,255,.22)}
.sw[aria-checked="true"] .knob{transform:translateX(20px)}
.sw[aria-checked="false"] .l1,.sw[aria-checked="true"] .l2{color:var(--text)}

.search{flex:1 1 220px;min-width:180px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font:inherit;outline:none}
.search input:focus{border-color:var(--line-2);box-shadow:0 0 0 3px rgba(160,185,255,.1)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55}
.btn{all:unset;cursor:pointer;padding:8px 12px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--line-2)}
.btn[hidden]{display:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:rgba(201,216,255,.08);border:1px solid var(--line-2);font-size:12.5px}
.chip b{font-weight:600;color:var(--accent)}
.chip button{all:unset;cursor:pointer;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip button:hover{background:rgba(255,255,255,.1);color:var(--text)}

/* таблица */
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.03);max-height:calc(100vh - 140px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
thead th{position:sticky;top:0;z-index:5;background:#10152A;text-align:left;font-weight:600;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0;border-bottom:1px solid var(--line-2);white-space:nowrap}
.th{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 14px}
.sortb{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 2px;border-radius:6px}
.sortb:hover{color:var(--text)}
.sortb .ar{opacity:.35;font-size:10px;width:10px}
th[data-sort] .sortb{color:var(--text)} th[data-sort] .ar{opacity:1;color:var(--accent)}
.fbtn{all:unset;cursor:pointer;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--dim);margin-left:auto}
.fbtn:hover{background:rgba(255,255,255,.06);color:var(--text)}
.fbtn.on{color:#0A0D1A;background:var(--accent);box-shadow:0 0 14px rgba(201,216,255,.45)}
tbody td{padding:6px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.r{transition:background .12s}
tbody tr.r:hover td{background:rgba(201,216,255,.045)}
.w1{width:1%;white-space:nowrap}
.simple .c-id{width:130px}.simple .c-type{width:22%}.simple .c-icon{width:14%}
thead th:first-child{border-top-left-radius:var(--radius)}thead th:last-child{border-top-right-radius:var(--radius)}
@media (min-width:900px){.card{overflow:visible;max-height:none}thead th{top:var(--barH,72px)}}
tr.grp td{background:rgba(255,255,255,.025);color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-bottom:1px solid var(--line)}
tr.grp b{color:var(--accent-2);font-weight:600;letter-spacing:.08em}
tr.grp .gc{color:var(--dim);margin-left:8px}
.copy{all:unset;cursor:pointer;border-radius:6px;padding:2px 5px;margin:-2px -5px}
.copy:hover{background:rgba(201,216,255,.1)}
.copy:focus-visible{outline:2px solid var(--accent)}
.mono{font-family:var(--mono);font-size:12.5px}
.id{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--accent-2);font-weight:600}
.guid{color:#AFC0E6;display:inline-block;max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.file{word-break:break-all}
.file{color:#C7D0E6}
.nm{color:var(--text);font-weight:500}
.none{color:var(--dim);font-style:italic}
.mod{color:var(--muted);white-space:nowrap}
.cls{display:inline-block;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
  color:hsl(var(--h) 85% 80%);background:hsl(var(--h) 60% 55% / .13);border:1px solid hsl(var(--h) 70% 65% / .28)}
.ic{width:58px;height:38px;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(201,216,255,.09),rgba(255,255,255,.015));border:1px solid var(--line);cursor:zoom-in;padding:0}
.ic img{max-width:52px;max-height:32px;display:block;image-rendering:auto}
.ic.empty{border-style:dashed;cursor:zoom-in}
.ic.empty::after{content:"пустая";font-size:10.5px;color:var(--dim)}
.ic.empty img{display:none}
.noic{display:inline-grid;place-items:center;width:58px;height:38px;border-radius:8px;border:1px dashed rgba(170,190,240,.12);color:var(--dim);font-size:11.5px}
.empty-state{padding:48px 16px;text-align:center;color:var(--muted)}
.more{text-align:center;margin-top:14px}
.err{max-width:640px;margin:30px auto;padding:18px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);color:var(--muted);text-align:center}
.foot{margin-top:18px;color:var(--dim);font-size:12.5px;text-align:center}
.foot code{font-family:var(--mono);color:var(--muted)}

/* попап фильтра */
.pop{position:absolute;z-index:50;width:260px;max-width:calc(100vw - 24px);background:rgba(14,18,34,.98);border:1px solid var(--line-2);border-radius:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 30px rgba(120,150,230,.08);padding:12px;display:none}
.pop.open{display:block}
.pop h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pop input[type=text]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:inherit;outline:none}
.pop input[type=text]:focus{border-color:var(--line-2)}
.opts{max-height:240px;overflow:auto;margin:8px -4px 0;padding:0 4px}
.opt{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:7px;cursor:pointer}
.opt:hover{background:rgba(255,255,255,.05)}
.opt input{accent-color:#C9D8FF;width:15px;height:15px;margin:0}
.opt .c{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.pa{display:flex;gap:8px;margin-top:10px}
.pa .btn{padding:6px 10px;font-size:12.5px}
.pa .btn.pri{background:var(--accent);color:#0A0D1A;border-color:transparent;font-weight:600}

/* просмотр иконки */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(2,3,8,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
.modal.open{display:grid}
.mbox{background:var(--panel-2);border:1px solid var(--line-2);border-radius:16px;padding:20px;max-width:440px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mimg{height:220px;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 40%,rgba(201,216,255,.12),rgba(255,255,255,.02));border:1px solid var(--line)}
.mimg img{max-width:92%;max-height:200px}
.mbox h3{margin:14px 0 4px;font-weight:500}
.mbox p{margin:2px 0;color:var(--muted);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:90;background:rgba(201,216,255,.95);color:#0A0D1A;
  padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  .bar{position:static;gap:10px}
  .card{max-height:none}
  tbody td{padding:8px 10px}
  .th{padding:6px 6px 6px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
let PKG = window.__IDLIST__ || null;
const ICON_BASE = window.__ICON_BASE__ || '';
let DATA = [];
let MODS = ['all'];
const PAGE = 400;

const COLS = {
  mod:  {label:'Mod name', kind:'cat'},
  cls:  {label:'Class',    kind:'cat'},
  id:   {label:'ID',       kind:'text'},
  name: {label:'Name',     kind:'text'},
  type: {label:'Type',     kind:'cat'},
  icon: {label:'Icon',     kind:'cat'},
  file: {label:'FileName', kind:'text'},
  guid: {label:'Guid',     kind:'text'},
};
const NARROW = new Set(['mod','cls','id','type','icon']);
const HUES = {Vehicle:210,Vehicle_Redirector:200,Gun:38,Magazine:22,Barricade:170,Structure:160,Storage:150,Sight:265,Tactical:275,Grip:290,Barrel:300,
  Medium:225,Large:235,Small:215,NPC:330,Effect:320,Spawn:140,Animal:110,Resource:125,Skin:345,Mythic:355,Dialogue:60,Quest:70,Vendor:80,
  Shirt:195,Pants:250,Vest:95,Hat:52,Mask:45,Glasses:285,Backpack:12,Food:28,Water:190,Medical:0,Melee:15,Tool:180,Throwable:8,Clothing:205};

const store = {
  get(k,d){try{const v=localStorage.getItem('voididlist.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('voididlist.'+k,JSON.stringify(v))}catch(e){}}
};
const state = {
  mod: store.get('mod', null), limit: PAGE,
  full: !!store.get('full', false),
  q:'', sort:null, dir:1, filters:{}
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconVal = r => r.icon ? (r.iconEmpty ? 'пустая' : 'есть') : 'нет';
const val = (r,c) => c==='icon' ? iconVal(r) : (r[c] ?? '');

function visibleCols(){
  if(!state.full) return ['id','name','type','icon'];
  const c = ['cls','id','name','type','icon','file','guid'];
  return state.mod==='all' ? ['mod',...c] : c;
}
function baseRows(){ return state.mod==='all' ? DATA : DATA.filter(r => r.mod===state.mod); }
function passes(r, skip){
  for(const [c,f] of Object.entries(state.filters)){
    if(c===skip) continue;
    if(COLS[c].kind==='cat'){ if(f.size && !f.has(String(val(r,c)))) return false; }
    else if(f && !String(val(r,c)).toLowerCase().includes(f.toLowerCase())) return false;
  }
  if(state.q){
    const q = state.q.toLowerCase();
    if(![r.id,r.name,r.file,r.guid,r.type,r.cls].some(v => String(v ?? '').toLowerCase().includes(q))) return false;
  }
  return true;
}
function activeFilters(){
  return Object.entries(state.filters).filter(([c,f]) => COLS[c].kind==='cat' ? f.size : f);
}

/* ---------- отрисовка ---------- */
function renderStats(){
  const ic = DATA.filter(r=>r.icon).length;
  const n = c => DATA.filter(r=>r.cat===c).length;
  $('#stats').innerHTML =
    `<span class="stat"><b>${DATA.length}</b> ассетов</span>`+
    `<span class="stat">модов <b>${MODS.length-1}</b></span>`+
    `<span class="stat">предметов <b>${n('ITEM')}</b></span>`+
    `<span class="stat">техники <b>${n('VEHICLE')}</b></span>`+
    `<span class="stat">с иконкой <b>${ic}</b></span>`;
}
function renderSeg(){
  $('#modSeg').innerHTML = MODS.map(m => {
    const n = m==='all' ? DATA.length : DATA.filter(r=>r.mod===m).length;
    return `<button type="button" data-mod="${esc(m)}" aria-pressed="${state.mod===m}">${m==='all'?'Все моды':esc(m)}<span class="n">${n}</span></button>`;
  }).join('');
}
function renderHead(){
  $('#head').innerHTML = visibleCols().map(c => {
    const f = state.filters[c];
    const on = COLS[c].kind==='cat' ? (f && f.size) : !!f;
    const s = state.sort===c;
    return `<th class="c-${c} ${state.full&&NARROW.has(c)?'w1':''}" ${s?'data-sort':''} aria-sort="${s?(state.dir>0?'ascending':'descending'):'none'}">
      <div class="th"><button class="sortb" data-sortc="${c}" title="Сортировать">${COLS[c].label}<span class="ar">${s?(state.dir>0?'▲':'▼'):'↕'}</span></button>
      <button class="fbtn${on?' on':''}" data-fc="${c}" title="Фильтр: ${COLS[c].label}" aria-label="Фильтр ${COLS[c].label}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18l-7 8.5V20l-4-2v-4.5z"/></svg></button></div></th>`;
  }).join('');
}
function cell(r,c){
  switch(c){
    case 'mod': return `<td class="mod">${esc(r.mod)}</td>`;
    case 'cls': return `<td><span class="cls">${esc(r.cls)}</span></td>`;
    case 'id': return `<td>${r.id==null?'<span class="none">нет ID</span>':`<button class="copy id" data-copy="${r.id}" title="Скопировать ID">${r.id}</button>`}</td>`;
    case 'name': return `<td>${r.name?`<span class="nm">${esc(r.name)}</span>`:'<span class="none">без имени</span>'}</td>`;
    case 'type': return `<td><span class="tag" style="--h:${HUES[r.type]??220}">${esc(r.type)}</span></td>`;
    case 'icon': return `<td>${r.icon?`<button class="ic${r.iconEmpty?' empty':''}" data-ico="${r._i}" title="Открыть иконку"><img src="${esc(r.icon)}" alt="${esc(r.name||r.file)}" loading="lazy"></button>`:'<span class="noic">нет</span>'}</td>`;
    case 'file': return `<td class="mono file">${esc(r.file)}</td>`;
    case 'guid': return `<td><button class="copy mono guid" data-copy="${esc(r.guid)}" title="Скопировать GUID">${esc(r.guid)}</button></td>`;
  }
}
function render(){
  renderSeg(); renderHead();
  $('table').classList.toggle('simple', !state.full);
  const cols = visibleCols();
  let rows = baseRows().filter(r => passes(r));
  if(state.sort){
    const c = state.sort, d = state.dir;
    rows = [...rows].sort((a,b) => {
      let x = val(a,c), y = val(b,c);
      if(c==='id'){ x = x===''?Infinity:x; y = y===''?Infinity:y; return (x-y)*d; }
      return String(x).localeCompare(String(y),'ru',{numeric:true})*d;
    });
  }
  let html = '', prev = null;
  const grouped = !state.sort;
  const counts = {};
  if(grouped) rows.forEach(r => { const k = r.mod+'|'+r.cls; counts[k]=(counts[k]||0)+1; });
  const shown = rows.slice(0, state.limit);
  for(const r of shown){
    if(grouped){
      const k = r.mod+'|'+r.cls;
      if(k!==prev){
        const t = state.mod==='all' ? `<b>${esc(r.mod)}</b> · ${esc(r.cls)}` : `<b>${esc(r.cls)}</b>`;
        html += `<tr class="grp"><td colspan="${cols.length}">${t}<span class="gc">${counts[k]}</span></td></tr>`;
        prev = k;
      }
    }
    html += `<tr class="r">${cols.map(c => cell(r,c)).join('')}</tr>`;
  }
  $('#body').innerHTML = html;
  $('#empty').hidden = rows.length>0;
  $('#more').hidden = rows.length <= shown.length;
  $('#moreBtn').textContent = `Показать ещё (показано ${shown.length} из ${rows.length})`;
  renderChips();
}
function renderChips(){
  const a = activeFilters();
  $('#reset').hidden = !(a.length || state.q);
  $('#chips').innerHTML = a.map(([c,f]) => {
    const v = COLS[c].kind==='cat' ? [...f].join(', ') : `содержит «${esc(f)}»`;
    return `<span class="chip">${COLS[c].label}: <b>${esc(v)}</b><button data-unf="${c}" aria-label="Убрать фильтр">✕</button></span>`;
  }).join('');
}

/* ---------- попап фильтра ---------- */
const pop = $('#pop'); let popCol = null;
function openPop(c, btn){
  popCol = c;
  const def = COLS[c];
  if(def.kind==='text'){
    pop.innerHTML = `<h4>${def.label}: содержит</h4><input type="text" id="pt" value="${esc(state.filters[c]||'')}" placeholder="Текст или число">
      <div class="pa"><button class="btn pri" id="papply">Применить</button><button class="btn" id="pclear">Очистить</button></div>`;
  } else {
    const pool = baseRows().filter(r => passes(r, c));
    const cnt = {}; pool.forEach(r => { const v=String(val(r,c)); cnt[v]=(cnt[v]||0)+1; });
    baseRows().forEach(r => { const v=String(val(r,c)); if(!(v in cnt)) cnt[v]=0; });
    const sel = state.filters[c] || new Set();
    const vals = Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'ru'));
    pop.innerHTML = `<h4>${def.label}</h4>${vals.length>7?'<input type="text" id="ps" placeholder="Найти значение">':''}
      <div class="opts">${vals.map(v => `<label class="opt" data-v="${esc(v.toLowerCase())}"><input type="checkbox" value="${esc(v)}" ${sel.has(v)?'checked':''}><span>${esc(v)}</span><span class="c">${cnt[v]}</span></label>`).join('')}</div>
      <div class="pa"><button class="btn pri" id="papply">Применить</button><button class="btn" id="pclear">Очистить</button></div>`;
  }
  pop.classList.add('open');
  const r = btn.getBoundingClientRect();
  const w = pop.offsetWidth;
  let left = r.right + window.scrollX - w;
  left = Math.max(12 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 12));
  pop.style.left = left+'px'; pop.style.top = (r.bottom + window.scrollY + 6)+'px';
  const first = pop.querySelector('input[type=text]'); if(first) first.focus();
}
function closePop(){ pop.classList.remove('open'); popCol = null; }
function applyPop(){
  const c = popCol; if(!c) return;
  if(COLS[c].kind==='text'){ const v = $('#pt').value.trim(); if(v) state.filters[c]=v; else delete state.filters[c]; }
  else { const s = new Set([...pop.querySelectorAll('.opts input:checked')].map(i=>i.value)); if(s.size) state.filters[c]=s; else delete state.filters[c]; }
  closePop(); render();
}
pop.addEventListener('click', e => {
  if(e.target.id==='papply') applyPop();
  if(e.target.id==='pclear'){ delete state.filters[popCol]; closePop(); render(); }
});
pop.addEventListener('input', e => {
  if(e.target.id==='ps'){ const q=e.target.value.toLowerCase(); pop.querySelectorAll('.opt').forEach(o=>o.style.display=o.dataset.v.includes(q)?'':'none'); }
});
pop.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.type==='text' && e.target.id!=='ps') applyPop(); });
document.addEventListener('mousedown', e => {
  if(pop.classList.contains('open') && !pop.contains(e.target) && !e.target.closest('.fbtn')) closePop();
});

/* ---------- события ---------- */
$('#modSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  state.mod = b.dataset.mod; store.set('mod', state.mod);
  for(const c of ['cls','mod']) delete state.filters[c];
  if(state.mod!=='all') delete state.filters.mod;
  closePop(); render();
});
$('#modeSw').addEventListener('click', () => {
  state.full = !state.full; store.set('full', state.full);
  $('#modeSw').setAttribute('aria-checked', state.full); closePop(); render();
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
$('#reset').addEventListener('click', () => { state.filters = {}; state.q=''; $('#q').value=''; render(); });
$('#chips').addEventListener('click', e => { const b=e.target.closest('[data-unf]'); if(b){ delete state.filters[b.dataset.unf]; render(); } });
$('#head').addEventListener('click', e => {
  const f = e.target.closest('.fbtn');
  if(f){ const c=f.dataset.fc; if(popCol===c) closePop(); else openPop(c,f); return; }
  const s = e.target.closest('.sortb');
  if(s){ const c=s.dataset.sortc;
    if(state.sort!==c){ state.sort=c; state.dir=1; } else if(state.dir===1){ state.dir=-1; } else { state.sort=null; }
    render(); }
});
const toast = $('#toast'); let tt;
function showToast(t){ toast.textContent=t; toast.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toast.classList.remove('show'),1400); }
async function copy(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy')}catch(_){} a.remove(); }
  showToast('Скопировано: '+t);
}
$('#body').addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if(c){ copy(c.dataset.copy); return; }
  const i = e.target.closest('[data-ico]');
  if(i){ const r = DATA[+i.dataset.ico];
    $('#mimg').innerHTML = r.iconEmpty ? '<span class="none">Иконка пустая: картинка прозрачная</span>' : `<img src="${esc(r.icon)}" alt="">`;
    $('#mname').textContent = r.name || r.file;
    $('#mfile').textContent = r.iconFile;
    $('#mmeta').textContent = `${r.mod} · ${r.cls} · ${r.type} · ID ${r.id ?? 'нет'} · ${r.guid}`;
    $('#modal').classList.add('open'); }
});
$('#modal').addEventListener('click', () => $('#modal').classList.remove('open'));
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closePop(); $('#modal').classList.remove('open'); } });
window.addEventListener('resize', closePop);
$('.card').addEventListener('scroll', closePop);

$('#modeSw').setAttribute('aria-checked', state.full);
$('#moreBtn').addEventListener('click', () => { state.limit += PAGE * 2; render(); });

function showError(msg){
  document.querySelector('.bar').hidden = true;
  document.querySelector('.card').outerHTML = `<div class="err">${msg}</div>`;
  $('#foot').textContent = '';
}
function normalize(){
  const cats = {}; (PKG.categories||[]).forEach(c => cats[c.key] = c.title);
  const titles = {}; (PKG.mods||[]).forEach(m => titles[m.key] = m.title || m.key);
  MODS = ['all', ...(PKG.mods||[]).map(m => titles[m.key])];
  DATA = (PKG.assets||[]).map((a,i) => ({
    _i:i, mod: titles[a.mod] || a.mod, cls: cats[a.category] || a.category, cat: a.category,
    id: a.id, name: a.name || '', type: a.type || '', guid: a.guid || '', file: a.file || '',
    icon: a.icon ? ICON_BASE + a.icon + (a.icon_hash ? '?v=' + a.icon_hash : '') : null,
    iconEmpty: false, iconFile: a.icon ? a.icon.split('/').pop() : '', stale: a.icon_state === 'stale'
  }));
  if(!MODS.includes(state.mod)) state.mod = MODS.length > 2 ? MODS[1] : 'all';
  const when = PKG.generated_at ? new Date(PKG.generated_at).toLocaleString('ru-RU', {dateStyle:'long', timeStyle:'short'}) : '';
  $('#foot').innerHTML = `Собрано программой VOID ID-List Builder${when ? ' · ' + esc(when) : ''} · клик по ID или GUID копирует значение`;
}
async function boot(){
  if(!PKG){
    try{
      const r = await fetch('idlist.json', {cache:'no-cache'});
      if(!r.ok) throw new Error(r.status);
      PKG = await r.json();
    }catch(e){
      showError('Не удалось загрузить <code>idlist.json</code>. Эта страница работает на GitHub Pages или через кнопку «Открыть просмотр» в программе VOID ID-List Builder. Если открыть файл двойным кликом, браузер не даст ему прочитать соседний файл.');
      return;
    }
  }
  normalize(); renderStats(); render();
}
boot();
function barH(){ const b=$('.bar'); document.documentElement.style.setProperty('--barH', (getComputedStyle(b).position==='sticky'? b.offsetHeight : 0)+'px'); }
barH(); addEventListener('resize', barH);

/* ---------- звёзды ---------- */
(function(){
  const cv = $('#stars'), ctx = cv.getContext('2d');
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [], W, H, dpr;
  function seed(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(W*H/2600);
    stars = Array.from({length:n}, () => {
      const big = Math.random() < .05;
      return { x:Math.random()*W, y:Math.random()*H, r: big ? 1.3+Math.random()*1.1 : .35+Math.random()*.9,
        a:.15+Math.random()*.75, s:.4+Math.random()*1.6, p:Math.random()*6.28,
        c: Math.random()<.12 ? '255,243,222' : (Math.random()<.2 ? '200,215,255' : '234,241,255'), big };
    });
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){
      const tw = still ? 1 : .55 + .45*Math.sin(t/1000*s.s + s.p);
      const a = s.a*tw;
      ctx.fillStyle = `rgba(${s.c},${a})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
      if(s.big){
        const g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*6);
        g.addColorStop(0,`rgba(${s.c},${a*.35})`); g.addColorStop(1,`rgba(${s.c},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x,s.y,s.r*6,0,6.283); ctx.fill();
      }
    }
    if(!still) requestAnimationFrame(draw);
  }
  seed(); requestAnimationFrame(draw);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { seed(); if(still) draw(0); }, 150); });
})();
</script>
</body>
